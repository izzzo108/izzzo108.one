<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#87ceeb">
    <title>Бег по дороге — IzzzO 108</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/game.css">
    <script src="../../shared/js/three-boot.js" data-vendor="../../vendor/"></script>
    <script src="../../shared/js/gltf-helpers.js"></script>
</head>
<body>
    <section id="runner-select" class="runner-select" aria-label="Выбор персонажа">
        <a class="hub-back hub-back--select" href="../../">← Игры</a>
        <header class="runner-select__header">
            <h1>Выбери персонажа</h1>
            <p>Нажми на карточку — сразу старт</p>
        </header>
        <div class="runner-grid" id="runnerGrid">
            <p class="runner-select__loading">Загрузка персонажей…</p>
        </div>
    </section>

    <div id="game-loading" class="game-loading is-hidden" role="status" aria-live="polite" aria-busy="true">
        <div class="game-loading__spinner" aria-hidden="true"></div>
        <p class="game-loading__text">Загрузка…</p>
    </div>

    <canvas id="game-canvas" class="is-hidden" aria-label="Игра: бег по дороге"></canvas>

    <div class="ui-layer is-hidden" id="game-ui">
        <a class="hub-back" href="../../">← Игры</a>
        <p class="hint-bar">Бег — быстрее. Прыжок — в воздух. Как в игре с машиной.</p>
        <div class="controls">
            <button type="button" class="btn btn-icon btn-run" id="btnRun" aria-label="Бег">
                <img class="btn__icon" src="../car-road/assets/icons/AArrowUpFilled.svg" alt="" width="32" height="32">
            </button>
            <button type="button" class="btn btn-icon btn-jump" id="btnJump" aria-label="Прыжок">
                <img class="btn__icon" src="../car-road/assets/icons/RampUpArrow.svg" alt="" width="32" height="32">
            </button>
            <button type="button" class="btn btn-icon btn-switch" id="btnNextRunner" aria-label="Сменить персонажа">
                <img class="btn__icon" src="../car-road/assets/icons/OncomingAutomobile.svg" alt="" width="32" height="32">
            </button>
        </div>
    </div>

    <script src="js/runner-select.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
